name: Android build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Ключ подписи общий с локальными сборками: иначе Android не даёт обновить
      # приложение поверх версии, подписанной другим ключом.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VDVOEM_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/app.keystore"
          {
            echo "VDVOEM_STORE_FILE=$RUNNER_TEMP/signing/app.keystore"
            echo "VDVOEM_STORE_PASSWORD=${{ secrets.VDVOEM_STORE_PASSWORD }}"
            echo "VDVOEM_KEY_ALIAS=${{ secrets.VDVOEM_KEY_ALIAS }}"
            echo "VDVOEM_KEY_PASSWORD=${{ secrets.VDVOEM_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Prepare artifact
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/vdvoem-${VERSION}-debug.apk"
          echo "APK: vdvoem-${VERSION}-debug.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdvoem-debug-apk
          path: artifacts/*.apk
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
